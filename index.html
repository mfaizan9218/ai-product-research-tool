<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Product Research Tool — Frontend AI Product Research Experience</title>
<meta name="description" content="An AI-powered product analysis interface (simulated AI engine): competitor matrices, review sentiment analysis, and feature roadmap generation, running entirely client-side. Not connected to a real LLM." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%237c6cff%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  /* Colors */
  --bg-main: hsl(224, 71%, 4%);
  --bg-panel: hsla(224, 71%, 6%, 0.6);
  --bg-input: hsla(224, 70%, 10%, 0.8);
  --bg-sidebar: hsla(224, 71%, 3%, 0.9);

  --border-glow: hsla(250, 95%, 68%, 0.2);
  --border-muted: hsla(210, 40%, 98%, 0.08);
  --border-focus: hsl(250, 95%, 68%);

  --color-primary: hsl(250, 95%, 68%);
  --color-secondary: hsl(270, 95%, 60%);
  --color-teal: hsl(180, 100%, 40%);

  --text-main: hsl(210, 40%, 98%);
  --text-muted: hsl(215, 20%, 75%);
  --text-dim: hsl(215, 12%, 55%);

  --color-success: hsl(145, 80%, 45%);
  --color-error: hsl(0, 85%, 60%);
  --color-warning: hsl(40, 95%, 60%);

  --grad-primary: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
  --grad-glow: radial-gradient(circle at top left, hsla(250, 95%, 68%, 0.15) 0%, transparent 60%);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--bg-main);
  background-image: var(--grad-glow);
  background-attachment: fixed;
  min-height: 100vh;
  overflow-x: hidden;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* Scrollbar styles */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: hsla(210, 40%, 98%, 0.1);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: hsla(210, 40%, 98%, 0.2);
}

/* Custom CSS Classes & Helpers */

.glass-panel {
  background: var(--bg-panel);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border: 1px solid var(--border-muted);
  border-radius: 16px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.glass-panel-hover:hover {
  border-color: var(--border-glow);
  box-shadow: 0 8px 32px 0 rgba(110, 89, 255, 0.15);
  transform: translateY(-2px);
}

.neon-glow {
  box-shadow: 0 0 20px 0 hsla(250, 95%, 68%, 0.2);
}

.glow-text {
  text-shadow: 0 0 8px hsla(250, 95%, 68%, 0.5);
}

/* Skeleton Loading State Animation */
@keyframes pulse-bg {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

.skeleton-loader {
  background: linear-gradient(90deg, 
    hsla(210, 40%, 98%, 0.03) 25%, 
    hsla(210, 40%, 98%, 0.08) 50%, 
    hsla(210, 40%, 98%, 0.03) 75%
  );
  background-size: 200% 100%;
  animation: pulse-bg 1.5s infinite;
  border-radius: 8px;
}

/* Status dots */
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  animation: pulse-dot-key 1.5s infinite;
}

@keyframes pulse-dot-key {
  0% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(110, 89, 255, 0.7);
  }
  70% {
    transform: scale(1);
    box-shadow: 0 0 0 6px rgba(110, 89, 255, 0);
  }
  100% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(110, 89, 255, 0);
  }
}

.success-dot {
  background-color: var(--color-success);
  box-shadow: 0 0 8px var(--color-success);
}

.error-dot {
  background-color: var(--color-error);
  box-shadow: 0 0 8px var(--color-error);
}

.warning-dot {
  background-color: var(--color-warning);
  box-shadow: 0 0 8px var(--color-warning);
}
.app-layout {
  display: flex;
  min-height: 100vh;
}

.app-main-content {
  flex: 1;
  margin-left: 260px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  transition: margin-left 0.2s ease;
}

.app-header {
  height: 70px;
  border-bottom: 1px solid var(--border-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  background: hsla(224, 71%, 4%, 0.4);
  backdrop-filter: blur(12px);
  z-index: 90;
}

.header-breadcrumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.9rem;
}

.breadcrumb-parent {
  color: var(--text-dim);
  font-weight: 500;
}

.breadcrumb-separator {
  color: var(--text-dim);
}

.breadcrumb-current {
  color: var(--text-main);
  font-weight: 600;
}

.app-view-container {
  flex: 1;
  padding: 24px 8px;
}

@media (max-width: 768px) {
  .app-main-content {
    margin-left: 70px;
  }
  .app-header {
    padding: 0 16px;
  }
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  font-family: 'Inter', sans-serif;
  font-size: 0.875rem;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
  outline: none;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.btn-primary {
  background: var(--grad-primary);
  color: var(--text-main);
  border: none;
  box-shadow: 0 4px 14px 0 rgba(110, 89, 255, 0.3);
}

.btn-primary:hover:not(:disabled) {
  filter: brightness(1.1);
  box-shadow: 0 6px 20px 0 rgba(110, 89, 255, 0.4);
  transform: translateY(-1px);
}

.btn-primary:active:not(:disabled) {
  transform: translateY(1px);
}

.btn-secondary {
  background: hsla(210, 40%, 98%, 0.03);
  color: var(--text-main);
  border: 1px solid var(--border-muted);
}

.btn-secondary:hover:not(:disabled) {
  background: hsla(210, 40%, 98%, 0.08);
  border-color: var(--border-glow);
  transform: translateY(-1px);
}

.btn-secondary:active:not(:disabled) {
  transform: translateY(1px);
}

.btn-destructive {
  background: hsla(0, 85%, 60%, 0.1);
  border: 1px solid hsla(0, 85%, 60%, 0.3);
  color: var(--color-error);
}

.btn-destructive:hover:not(:disabled) {
  background: hsla(0, 85%, 60%, 0.2);
  border-color: var(--color-error);
  transform: translateY(-1px);
}

.btn-destructive:active:not(:disabled) {
  transform: translateY(1px);
}

.btn-loading {
  position: relative;
}

.btn-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--text-main);
  border-radius: 50%;
  animation: btn-spin 0.6s linear infinite;
}

.btn-icon {
  flex-shrink: 0;
}

@keyframes btn-spin {
  to {
    transform: rotate(360deg);
  }
}
/* Custom style hooks for card structures */
.card-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-muted);
}

.card-body {
  padding: 24px;
}

.card-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border-muted);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  margin-bottom: 16px;
}

.form-label {
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.label-required {
  color: var(--color-error);
}

.form-input {
  background: var(--bg-input);
  border: 1px solid var(--border-muted);
  border-radius: 8px;
  padding: 10px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 0.875rem;
  color: var(--text-main);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  width: 100%;
}

.form-input::placeholder {
  color: var(--text-dim);
}

.form-input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(110, 89, 255, 0.25);
  outline: none;
}

.form-input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.form-textarea {
  resize: vertical;
}

.form-select {
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 16px;
  padding-right: 40px;
}

.form-select option {
  background: var(--bg-main);
  color: var(--text-main);
}

.input-error {
  border-color: var(--color-error) !important;
}

.input-error:focus {
  box-shadow: 0 0 0 3px rgba(255, 89, 89, 0.25) !important;
}

.form-error-text {
  font-size: 0.75rem;
  color: var(--color-error);
  font-weight: 500;
}
.skeleton-cards-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  width: 100%;
}

.skeleton-card-item {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.skeleton-header {
  height: 24px;
  width: 60%;
  margin-bottom: 8px;
}

.skeleton-line {
  height: 14px;
  border-radius: 4px;
}

/* Table Skeletons */
.skeleton-table {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

.skeleton-row {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-muted);
}

.skeleton-header-row {
  border-bottom: 2px solid var(--border-muted);
}

.skeleton-cell {
  height: 16px;
  flex: 1;
}

/* Kanban Skeletons */
.skeleton-kanban {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  width: 100%;
}

.skeleton-column {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.skeleton-title {
  height: 28px;
  width: 80%;
  border-radius: 8px;
}

.skeleton-card {
  height: 120px;
  border-radius: 12px;
}
.app-sidebar {
  width: 260px;
  height: 100vh;
  position: fixed;
  top: 0;
  left: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-muted);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  z-index: 100;
  backdrop-filter: blur(20px);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 32px 8px;
  border-bottom: 1px solid var(--border-muted);
  margin-bottom: 24px;
}

.brand-logo {
  color: var(--color-primary);
  filter: drop-shadow(0 0 8px hsla(250, 95%, 68%, 0.5));
}

.brand-name {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: -0.01em;
  background: linear-gradient(135deg, #ffffff 0%, var(--text-muted) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.nav-item-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  background: transparent;
  border: none;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.nav-item-btn:hover {
  background: hsla(210, 40%, 98%, 0.04);
}

.nav-item-btn.active {
  background: hsla(250, 95%, 68%, 0.1);
  border-left: 3px solid var(--color-primary);
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
}

.nav-item-btn.active .nav-icon {
  color: var(--color-primary);
}

.nav-item-btn.active .nav-label {
  color: var(--text-main);
  font-weight: 600;
}

.nav-icon {
  color: var(--text-muted);
  flex-shrink: 0;
}

.nav-label {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-muted);
}

.nav-item-btn.locked {
  opacity: 0.7;
}

.lock-badge {
  position: absolute;
  right: 12px;
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--text-dim);
  background: hsla(210, 40%, 98%, 0.05);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border-muted);
}

.sidebar-footer {
  padding-top: 16px;
  border-top: 1px solid var(--border-muted);
  display: flex;
  justify-content: center;
}

.version-tag {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-weight: 500;
}

@media (max-width: 768px) {
  .app-sidebar {
    width: 70px;
    padding: 24px 8px;
  }
  .brand-name, .nav-label, .lock-badge, .version-tag {
    display: none;
  }
  .sidebar-brand {
    justify-content: center;
    padding: 0 0 24px 0;
  }
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 20px;
  background: hsla(224, 71%, 6%, 0.4);
}

.status-label {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-muted);
}

.status-connected .status-label {
  color: var(--text-main);
}
.competitor-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 24px;
}

.competitor-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 24px;
  align-items: start;
}

@media (max-width: 1024px) {
  .competitor-grid {
    grid-template-columns: 1fr;
  }
}

.setup-panel-card {
  position: sticky;
  top: 94px;
}

@media (max-width: 1024px) {
  .setup-panel-card {
    position: static;
  }
}

.setup-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.error-message-block {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(220, 38, 38, 0.1);
  border: 1px solid rgba(220, 38, 38, 0.3);
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 0.8rem;
  color: var(--color-error);
}

.error-message-block svg {
  flex-shrink: 0;
}

.analyze-btn {
  width: 100%;
  margin-top: 8px;
}

/* Results Canvas */
.results-canvas {
  width: 100%;
}

.loading-results-card {
  padding: 48px 24px;
}

.loading-state-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  width: 100%;
}

.loading-hint {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 500;
  animation: pulse-hint 2s infinite;
}

@keyframes pulse-hint {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.empty-results-card {
  height: 480px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
}

.empty-state-canvas {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 480px;
  gap: 16px;
}

.canvas-icon {
  color: var(--text-dim);
}

.empty-state-canvas h3 {
  font-size: 1.25rem;
}

.empty-state-canvas p {
  font-size: 0.875rem;
  color: var(--text-muted);
  line-height: 1.6;
}

.results-wrapper {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Floating Actions Bar */
.actions-floating-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: hsla(224, 71%, 6%, 0.7);
}

.results-status {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-teal);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.results-status::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--color-teal);
  box-shadow: 0 0 6px var(--color-teal);
}

.actions-button-group {
  display: flex;
  gap: 10px;
}

.result-detail-card {
  overflow: hidden;
}

.summary-paragraph {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.7;
}

/* Matrix Table Styles */
.table-scrollable {
  overflow-x: auto;
  padding: 0 !important;
}

.matrix-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.875rem;
}

.matrix-table th {
  padding: 16px 24px;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-muted);
  font-size: 0.85rem;
  background: hsla(210, 40%, 98%, 0.02);
}

.matrix-table td {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-muted);
  vertical-align: top;
  line-height: 1.5;
}

.matrix-table-row:hover {
  background: hsla(210, 40%, 98%, 0.01);
}

.matrix-cell-feature {
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
}

.matrix-cell-subject {
  color: var(--text-muted);
}

.matrix-cell-competitor {
  color: var(--text-muted);
}

.matrix-cell-gap {
  color: var(--color-teal);
  font-weight: 500;
}

/* SWOT Quadrants Grid */
.swot-grid-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 600px) {
  .swot-grid-container {
    grid-template-columns: 1fr;
  }
}

.swot-quadrant {
  padding: 24px;
}

.swot-quadrant h4 {
  font-size: 1rem;
  margin-bottom: 14px;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.swot-quadrant ul {
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.swot-quadrant li {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}

.swot-quadrant.s h4 { color: var(--color-success); }
.swot-quadrant.w h4 { color: var(--color-error); }
.swot-quadrant.o h4 { color: var(--color-primary); }
.swot-quadrant.t h4 { color: var(--color-warning); }

.swot-quadrant.s { border-left: 3px solid var(--color-success); }
.swot-quadrant.w { border-left: 3px solid var(--color-error); }
.swot-quadrant.o { border-left: 3px solid var(--color-primary); }
.swot-quadrant.t { border-left: 3px solid var(--color-warning); }

/* Recommendation Section */
.recommendation-card {
  border-left: 3px solid var(--color-teal);
}

.recommendations-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.rec-icon {
  color: var(--color-teal);
}

.recommendation-text {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.7;
}
.dashboard-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

.dashboard-header {
  margin-bottom: 36px;
}

.dashboard-header h1 {
  font-size: 2.25rem;
  margin-bottom: 8px;
  background: var(--grad-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.dashboard-header .subtitle {
  color: var(--text-muted);
  font-size: 0.95rem;
  line-height: 1.6;
  max-width: 800px;

// ---- Shared components (class names match the original app's CSS) ----

function Button({ children, onClick, type = 'button', variant = 'primary', disabled = false, loading = false, className = '', icon: Icon }) {
  return h(
    'button',
    {
      type,
      onClick,
      disabled: disabled || loading,
      className: `btn btn-${variant} ${loading ? 'btn-loading' : ''} ${className}`
    },
    loading ? h('span', { className: 'btn-spinner' }) : Icon ? h(Icon, { className: 'btn-icon', size: 16 }) : null,
    h('span', { className: 'btn-text' }, children)
  );
}

function Card({ children, className = '', hoverable = true, onClick }) {
  return h(
    'div',
    {
      className: `glass-panel ${hoverable ? 'glass-panel-hover' : ''} ${className}`,
      onClick,
      style: { cursor: onClick ? 'pointer' : 'default' }
    },
    children
  );
}

function Input({ label, id, type = 'text', placeholder = '', value, onChange, disabled = false, error = '', options = [], rows = 4, className = '', required = false }) {
  return h(
    'div',
    { className: `form-group ${className}` },
    label && h('label', { htmlFor: id, className: 'form-label' }, label, ' ', required && h('span', { className: 'label-required' }, '*')),
    type === 'textarea'
      ? h('textarea', {
          id,
          rows,
          placeholder,
          value,
          onChange,
          disabled,
          className: `form-input form-textarea ${error ? 'input-error' : ''}`,
          required
        })
      : type === 'select'
      ? h(
          'select',
          {
            id,
            value,
            onChange,
            disabled,
            className: `form-input form-select ${error ? 'input-error' : ''}`,
            required
          },
          options.map((opt) => h('option', { key: opt.value, value: opt.value }, opt.label))
        )
      : h('input', {
          id,
          type,
          placeholder,
          value,
          onChange,
          disabled,
          className: `form-input ${error ? 'input-error' : ''}`,
          required
        }),
    error && h('span', { className: 'form-error-text' }, error)
  );
}

function Loader({ type = 'card', count = 1 }) {
  const items = Array.from({ length: count });

  if (type === 'table') {
    return h(
      'div',
      { className: 'skeleton-table' },
      h(
        'div',
        { className: 'skeleton-row skeleton-header-row' },
        h('div', { className: 'skeleton-cell skeleton-loader' }),
        h('div', { className: 'skeleton-cell skeleton-loader' }),
        h('div', { className: 'skeleton-cell skeleton-loader' }),
        h('div', { className: 'skeleton-cell skeleton-loader' })
      ),
      items.map((_, idx) =>
        h(
          'div',
          { key: idx, className: 'skeleton-row' },
          h('div', { className: 'skeleton-cell skeleton-loader', style: { width: '40%' } }),
          h('div', { className: 'skeleton-cell skeleton-loader', style: { width: '20%' } }),
          h('div', { className: 'skeleton-cell skeleton-loader', style: { width: '20%' } }),
          h('div', { className: 'skeleton-cell skeleton-loader', style: { width: '10%' } })
        )
      )
    );

  if (type === 'kanban') {

        h(
          'div',
          { key: colIdx, className: 'skeleton-column' },

          items.map((_, idx) => h('div', { key: idx, className: 'skeleton-card skeleton-loader' }))
        )
      )
    );
  }

  return h(
    'div',
    { className: 'skeleton-cards-container' },
    items.map((_, idx) =>
      h(
        'div',

    )
  );
}

function Navigation() {
  const { currentView, setCurrentView, isConnected } = React.useContext(AppContext);

  const navItems = [
    { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard, requiresKey: true },
    { id: 'competitor', label: 'Competitor Matrix', icon: BarChart3, requiresKey: true },
    { id: 'review', label: 'Review Analyzer', icon: MessageSquare, requiresKey: true },
    { id: 'feature', label: 'Feature Canvas', icon: KanbanSquare, requiresKey: true },
    { id: 'settings', label: 'BYOAI Settings', icon: SettingsIcon, requiresKey: false }
  ];

  const handleNavClick = (id, requiresKey) => {
    if (requiresKey && !isConnected) {
      alert('Please configure and save an active API key in Settings first.');
      setCurrentView('settings');
      return;
    }
    setCurrentView(id);
  };

  return h(
    'aside',
    { className: 'app-sidebar' },
    h(
      'div',
      { className: 'sidebar-brand' },
      h(Compass, { className: 'brand-logo', size: 24 }),
      h('span', { className: 'brand-name' }, 'Synthesize')
    ),
    h(
      'nav',
      { className: 'sidebar-nav' },
      navItems.map((item) => {
        const Icon = item.icon;
        const isActive = currentView === item.id;
        const isLocked = item.requiresKey && !isConnected;
        return h(
          'button',
          {
            key: item.id,
            onClick: () => handleNavClick(item.id, item.requiresKey),
            className: `nav-item-btn ${isActive ? 'active' : ''} ${isLocked ? 'locked' : ''}`
          },
          h(Icon, { size: 18, className: 'nav-icon' }),
          h('span', { className: 'nav-label' }, item.label),
          isLocked && h('span', { className: 'lock-badge' }, 'Key Req.')
        );
      })
    ),
    h('div', { className: 'sidebar-footer' }, h('span', { className: 'version-tag' }, 'Demo v1.0.0'))
  );
}

function firstCompetitor(competitorsStr) {
  const parts = competitorsStr.split(',').map((s) => s.trim()).filter(Boolean);
  return parts[0] || 'the leading competitor';

async function simulateReviewAnalysis(reviewsText) {
  await wait(1300 + Math.random() * 900);

  const lineCount = reviewsText.split(/\n|---/).map((l) => l.trim()).filter(Boolean).length || 1;
  const positive = Math.min(78, 48 + Math.round(lineCount % 10));
  const negative = Math.max(8, 22 - Math.round(lineCount % 7));
  const neutral = Math.max(0, 100 - positive - negative);

  return {
    sentiment: { positive, neutral, negative },
    painPoints: [
      {
        rank: 1,
        issue: 'Users report a steep learning curve during their first session.',
        impact: 'High',
        action: 'Add an interactive walkthrough that activates on first login.'
      },
      {
        rank: 2,
        issue: 'Mobile experience feels like an afterthought compared to desktop.',
        impact: 'Medium',
        action: 'Prioritize a responsive pass on the three most-used screens.'
      },
      {
        rank: 3,
        issue: 'Notification settings are hard to find and overly noisy by default.',
        impact: 'Medium',
        action: 'Ship sane notification defaults and a one-click "mute all" option.'
      },
      {
        rank: 4,
        issue: 'Occasional confusion around what the free vs. paid tier includes.',

}

  const [history, setHistory] = React.useState(() => {
    try {
      const stored = localStorage.getItem('ai_research_history_demo');
      return stored ? JSON.parse(stored) : [];
    } catch {
      return [];
    }
  });

  const handleProviderChange = (provider) => {
    setActiveProviderState(provider);
    setActiveModel(DEFAULT_MODELS[provider] || '');
  };

  const saveApiKeys = (newKeys) => {
    setApiKeys(newKeys);
    try {
      localStorage.setItem('ai_research_keys_demo', JSON.stringify(newKeys));
    } catch {}
  };

  const addHistoryItem = (item) => {
    const updated = [
      {
        id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 9),
        timestamp: new Date().toISOString(),
        provider: activeProvider,
        model: activeModel,
        ...item
      },
      ...history
    ];
    setHistory(updated);
    try {
      localStorage.setItem('ai_research_history_demo', JSON.stringify(updated));
    } catch {}
  };

  const deleteHistoryItem = (id) => {
    const updated = history.filter((item) => item.id !== id);
    setHistory(updated);
    try {
      localStorage.setItem('ai_research_history_demo', JSON.stringify(updated));
    } catch {}
  };

  const [loadedHistoryItem, setLoadedHistoryItem] = React.useState(null);

  const clearAllData = () => {
    setApiKeys({ gemini: '', openai: '', anthropic: '', openrouter: '' });
    setHistory([]);
    setLoadedHistoryItem(null);
    setActiveProviderState('gemini');
    setActiveModel(DEFAULT_MODELS.gemini);
    try {
      localStorage.removeItem('ai_research_keys_demo');
      localStorage.removeItem('ai_research_history_demo');
    } catch {}
    setCurrentView('settings');
  };

  const isConnected = !!apiKeys[activeProvider];

  return h(
    AppContext.Provider,
    {
      value: {
        currentView,
        setCurrentView,
        activeProvider,
        setActiveProvider: handleProviderChange,
        activeModel,
        setActiveModel,
        apiKeys,
        saveApiKeys,
        history,
        addHistoryItem,
        deleteHistoryItem,
        clearAllData,
        isConnected,
        defaultModels: DEFAULT_MODELS,
        loadedHistoryItem,
        setLoadedHistoryItem
      }
    },
    children
  );
}

// ---- Competitor Matrix view ----
function CompetitorView() {
  const { addHistoryItem, loadedHistoryItem, setLoadedHistoryItem } = React.useContext(AppContext);

  const [subjectProduct, setSubjectProduct] = React.useState('');
  const [competitors, setCompetitors] = React.useState('');
  const [focusArea, setFocusArea] = React.useState('Core Features');

  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [result, setResult] = React.useState(null);
  const [isCopied, setIsCopied] = React.useState(false);
  const [isSaved, setIsSaved] = React.useState(false);

  React.useEffect(() => {
    if (loadedHistoryItem && loadedHistoryItem.type === 'competitor') {
      const { metadata, data } = loadedHistoryItem;
      if (metadata) {
        setSubjectProduct(metadata.subjectProduct || '');
        setCompetitors(metadata.competitors || '');
        setFocusArea(metadata.focusArea || 'Core Features');
      } else {
        setSubjectProduct(loadedHistoryItem.projectName.replace(' Competitor Map', ''));
      }
      setResult(data);
      setIsSaved(true);
      setLoadedHistoryItem(null);
    }
  }, [loadedHistoryItem, setLoadedHistoryItem]);

  const focusOptions = [
    { value: 'Core Features', label: 'Core Features & Functionality' },
    { value: 'Pricing & Value Proposition', label: 'Pricing, Tiers & Monetization' },
    { value: 'User Experience & Branding', label: 'UX, Interface & Visual Design' },
    { value: 'Technical Spec & Stack Gaps', label: 'Technical Capabilities & Specs' }
  ];

  const handleRunAnalysis = async (e) => {
    e.preventDefault();
    if (!subjectProduct.trim() || !competitors.trim()) {
      setError('All text fields are required.');
      return;
    }
    setLoading(true);
    setError('');
    setResult(null);
    setIsSaved(false);
    try {
      const parsedData = await simulateCompetitorAnalysis(subjectProduct, competitors, focusArea);
      setResult(parsedData);
    } catch (err) {
      setError(err.message || 'An error occurred during competitive analysis.');
    } finally {
      setLoading(false);
    }
  };

  const handleCopyMarkdown = () => {
    if (!result) return;
    let md = `# Competitor Matrix: ${subjectProduct} vs ${competitors}\n\n`;
    md += `**Focus Area:** ${focusArea}\n\n`;
    md += `## Executive Summary\n${result.summary}\n\n`;
    md += `## Benchmarking Matrix\n\n`;
    md += `| Dimension | Subject Product | Competitors | Gap / Opportunity |\n`;
    md += `| :--- | :--- | :--- | :--- |\n`;
    result.comparisonGrid.forEach((row) => {
      md += `| ${row.featureName} | ${row.subjectStatus} | ${row.competitorStatus} | ${row.gapStatus} |\n`;
    });
    md += `\n## SWOT Analysis\n\n`;
    md += `### Strengths\n${result.swot.strengths.map((s) => `- ${s}`).join('\n')}\n\n`;
    md += `### Weaknesses\n${result.swot.weaknesses.map((w) => `- ${w}`).join('\n')}\n\n`;
    md += `### Opportunities\n${result.swot.opportunities.map((o) => `- ${o}`).join('\n')}\n\n`;
    md += `### Threats\n${result.swot.threats.map((t) => `- ${t}`).join('\n')}\n\n`;
    md += `## Recommendation (USP)\n${result.usp}\n`;
    navigator.clipboard.writeText(md);
    setIsCopied(true);
    setTimeout(() => setIsCopied(false), 2000);
  };

  const handleDownloadJSON = () => {
    if (!result) return;
    const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `competitor-analysis-${Date.now()}.json`;
    link.click();
    URL.revokeObjectURL(url);
  };

  const handleSaveToHistory = () => {
    if (!result || isSaved) return;
    addHistoryItem({
      projectName: `${subjectProduct} Competitor Map`,
      type: 'competitor',
      metadata: { subjectProduct, competitors, focusArea },
      data: result
    });
    setIsSaved(true);
  };

  return h(
    'div',
    { className: 'competitor-container' },
    h(
      'div',
      { className: 'competitor-grid' },
      h(
        Card,
        { className: 'setup-panel-card', hoverable: false },
        h('div', { className: 'card-header' }, h('h3', null, 'Competitor Setup')),
        h(
          'form',
          { onSubmit: handleRunAnalysis, className: 'card-body setup-form' },
          h(Input, {
            label: 'Subject Product Name / Core Idea',
            id: 'subject-product',
            placeholder: 'e.g. Synthesize AI research tool',
            value: subjectProduct,
            onChange: (e) => setSubjectProduct(e.target.value),
            required: true
          }),
          h(Input, {
            label: 'Competitor Product Name(s)',
            id: 'competitors-input',
            placeholder: 'e.g. CompetitorA, CompetitorB (comma separated)',
            value: competitors,
            onChange: (e) => setCompetitors(e.target.value),
            required: true
          }),
          h(Input, {
            label: 'Research Focus Area',
            id: 'focus-area',
            type: 'select',
            options: focusOptions,
            value: focusArea,
            onChange: (e) => setFocusArea(e.target.value)
          }),
          error && h('div', { className: 'error-message-block' }, h(AlertTriangle, { size: 18 }), h('span', null, error)),
          h(Button, { type: 'submit', loading, className: 'analyze-btn', icon: ArrowRight }, 'Analyze Competitors')
        )
      ),
      h(
        'div',
        { className: 'results-canvas' },
        loading
          ? h(
              Card,
              { className: 'loading-results-card', hoverable: false },
              h(
                'div',
                { className: 'loading-state-wrapper' },
                h(Loader, { type: 'table', count: 5 }),
                h('p', { className: 'loading-hint' }, 'Synthesizing landscape features… please wait.')
              )
            )
          : result
          ? h(
              'div',
              { className: 'results-wrapper' },
              h(
                'div',
                { className: 'actions-floating-bar glass-panel' },
                h('span', { className: 'results-status' }, 'Analysis Generated'),
                h(
                  'div',
                  { className: 'actions-button-group' },
                  h(Button, { variant: 'secondary', onClick: handleCopyMarkdown, icon: Copy }, isCopied ? 'Copied MD!' : 'Copy Markdown'),
                  h(Button, { variant: 'secondary', onClick: handleDownloadJSON, icon: Download }, 'JSON'),
                  h(Button, { variant: isSaved ? 'secondary' : 'primary', onClick: handleSaveToHistory, disabled: isSaved, icon: Save }, isSaved ? 'Saved to History' : 'Save Report')
                )
              ),
              h(
                Card,
                { className: 'result-detail-card', hoverable: false },
                h('div', { className: 'card-header font-outfit' }, h('h3', null, 'Executive Summary')),
                h('div', { className: 'card-body' }, h('p', { className: 'summary-paragraph' }, result.summary))
              ),
              h(
                Card,
                { className: 'result-detail-card', hoverable: false },
                h('div', { className: 'card-header' }, h('h3', null, 'Feature Benchmarking Matrix')),
                h(
                  'div',
                  { className: 'card-body table-scrollable' },
                  h(
                    'table',
                    { className: 'matrix-table' },
                    h(
                      'thead',
                      null,
                      h('tr', null, h('th', null, 'Analysis Vector'), h('th', null, 'Your Product'), h('th', null, 'Competitor Landscape'), h('th', null, 'Opportunity Gap'))
                    ),
                    h(
                      'tbody',
                      null,
                      result.comparisonGrid.map((row, idx) =>
                        h(
                          'tr',
                          { key: idx, className: 'matrix-table-row' },
                          h('td', { className: 'matrix-cell-feature' }, row.featureName),
                          h('td', { className: 'matrix-cell-subject' }, row.subjectStatus),
                          h('td', { className: 'matrix-cell-competitor' }, row.competitorStatus),
                          h('td', { className: 'matrix-cell-gap' }, row.gapStatus)
                        )
                      )
                    )
                  )
                )
              ),
              h(
                'div',
                { className: 'swot-grid-container' },
                h(Card, { className: 'swot-quadrant s', hoverable: false }, h('h4', null, 'Strengths (S)'), h('ul', null, result.swot.strengths.map((s, i) => h('li', { key: i }, s)))),
                h(Card, { className: 'swot-quadrant w', hoverable: false }, h('h4', null, 'Weaknesses (W)'), h('ul', null, result.swot.weaknesses.map((w, i) => h('li', { key: i }, w)))),
                h(Card, { className: 'swot-quadrant o', hoverable: false }, h('h4', null, 'Opportunities (O)'), h('ul', null, result.swot.opportunities.map((o, i) => h('li', { key: i }, o)))),
                h(Card, { className: 'swot-quadrant t', hoverable: false }, h('h4', null, 'Threats (T)'), h('ul', null, result.swot.threats.map((t, i) => h('li', { key: i }, t))))
              ),
              h(
                Card,
                { className: 'result-detail-card recommendation-card', hoverable: false },

                h('div', { className: 'card-body' }, h('p', { className: 'recommendation-text' }, result.usp))
              )
            )
          : h(
              Card,
              { className: 'empty-results-card', hoverable: false },
              h(
                'div',
                { className: 'empty-state-canvas' },
                h(BarChart3, { size: 48, className: 'canvas-icon' }),
                h('h3', null, 'Landscape Comparison Sandbox'),
                h('p', null, 'Provide your product context and competitor names on the left, then click "Analyze" to map out features and SWOT insights.')
              )
            )
      )
    )
  );

  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [result, setResult] = React.useState(null);
  const [isCopied, setIsCopied] = React.useState(false);
  const [isSaved, setIsSaved] = React.useState(false);

  React.useEffect(() => {
    if (loadedHistoryItem && loadedHistoryItem.type === 'review') {
      const { metadata, data } = loadedHistoryItem;
      if (metadata) {
        setProjectName(metadata.projectName || '');
        setReviewsText(metadata.reviewsText || '');
        setInputMode(metadata.inputMode || 'text');
      } else {
        setProjectName(loadedHistoryItem.projectName.replace(' Review Summary', ''));
      }
      setResult(data);
      setIsSaved(true);
      setLoadedHistoryItem(null);
    }
  }, [loadedHistoryItem, setLoadedHistoryItem]);

  const handleCsvUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setCsvFile(file);
    const reader = new FileReader();
    reader.onload = (evt) => {
      const text = evt.target.result;
      const lines = text.split('\n');
      if (lines.length > 0) {
        const headers = lines[0].split(',').map((hh) => hh.trim().replace(/^["']|["']$/g, ''));
        setCsvColumns(headers);
        setSelectedBodyCol(headers[0] || '');
      }
    };
    reader.readAsText(file);
  };

  const handleRunAnalysis = async (e) => {
    e.preventDefault();
    if (!projectName.trim()) {
      setError('Project Name is required.');
      return;
    }

    let rawReviewsContent = '';

    if (inputMode === 'text') {
      if (!reviewsText.trim()) {
        setError('Please paste some reviews to analyze.');
        return;
      }
      rawReviewsContent = reviewsText;
    } else {
      if (!csvFile) {
        setError('Please upload a CSV file first.');
        return;
      }
      setLoading(true);
      setError('');
      try {
        const text = await csvFile.text();
        const lines = text.split('\n');
        const headers = lines[0].split(',').map((hh) => hh.trim().replace(/^["']|["']$/g, ''));
        const colIdx = headers.indexOf(selectedBodyCol);
        if (colIdx === -1) throw new Error('Selected review body column not found in CSV.');
        const reviews = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cells = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          const reviewText = cells[colIdx] ? cells[colIdx].trim().replace(/^["']|["']$/g, '') : '';
          if (reviewText) reviews.push(reviewText);
        }
        if (reviews.length === 0) throw new Error('No reviews extracted from selected column.');
        rawReviewsContent = reviews.slice(0, 40).join('\n---\n');
      } catch (err) {
        setError(err.message);
        setLoading(false);
        return;
      }
    }

    setLoading(true);
    setError('');
    setResult(null);
    setIsSaved(false);

    try {
      const parsedData = await simulateReviewAnalysis(rawReviewsContent);
      setResult(parsedData);
    } catch (err) {
      setError(err.message || 'An error occurred during review analysis.');
    } finally {
      setLoading(false);
    }
  };

  const handleCopyMarkdown = () => {
    if (!result) return;
    let md = `# Review Sentiment Analysis: ${projectName}\n\n`;
    md += `## Sentiment Distribution\n`;
    md += `- Positive: ${result.sentiment.positive}%\n`;
    md += `- Neutral: ${result.sentiment.neutral}%\n`;
    md += `- Negative: ${result.sentiment.negative}%\n\n`;
    md += `## Key Customer Pain Points\n\n`;
    result.painPoints.forEach((point) => {
      md += `### ${point.rank}. ${point.issue} (Impact: ${point.impact})\n`;
      md += `**Actionable Solution:** ${point.action}\n\n`;
    });
    md += `## Key Praise Points\n\n`;
    result.positivePraise.forEach((p) => {
      md += `- ${p}\n`;
    });
    md += `\n## Requested Feature Ideas\n\n`;
    result.suggestedFeatures.forEach((f) => {
      md += `- ${f}\n`;
    });
    navigator.clipboard.writeText(md);
    setIsCopied(true);
    setTimeout(() => setIsCopied(false), 2000);
  };

  const handleDownloadJSON = () => {
    if (!result) return;
    const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `review-analysis-${Date.now()}.json`;
    link.click();
    URL.revokeObjectURL(url);
  };

  const handleSaveToHistory = () => {
    if (!result || isSaved) return;
    addHistoryItem({
      projectName: `${projectName} Review Summary`,
      type: 'review',
      metadata: { projectName, reviewsText, inputMode },
      data: result
    });
    setIsSaved(true);
  };

  return h(
    'div',
    { className: 'review-container' },
    h(
      'div',
      { className: 'review-grid' },
      h(
        Card,
        { className: 'setup-panel-card', hoverable: false },
        h('div', { className: 'card-header' }, h('h3', null, 'Review Input Panel')),
        h(
          'form',
          { onSubmit: handleRunAnalysis, className: 'card-body setup-form' },
          h(Input, {
            label: 'Project / Product Name',
            id: 'project-name',
            placeholder: 'e.g. Synthesize App Store Feed',
            value: projectName,
            onChange: (e) => setProjectName(e.target.value),
            required: true
          }),
          h(
            'div',
            { className: 'input-mode-tabs' },
            h('button', { type: 'button', className: `input-mode-btn ${inputMode === 'text' ? 'active' : ''}`, onClick: () => setInputMode('text') }, 'Paste Reviews'),
            h('button', { type: 'button', className: `input-mode-btn ${inputMode === 'csv' ? 'active' : ''}`, onClick: () => setInputMode('csv') }, 'CSV Import')
          ),
          inputMode === 'text'
            ? h(Input, {
                label: 'Paste Customer Feedback (one per line)',
                id: 'raw-reviews',
                type: 'textarea',
                placeholder: 'Paste raw customer feedback reviews here… (Max 40 rows)',
                value: reviewsText,
                onChange: (e) => setReviewsText(e.target.value),
                rows: 8
              })
            : h(
                'div',
                { className: 'csv-upload-section' },
                h(
                  'label',
                  { className: 'csv-drop-zone' },
                  h(Upload, { className: 'upload-icon', size: 24 }),
                  h('span', null, 'Choose CSV File'),
                  h('span', { className: 'file-name' }, csvFile ? csvFile.name : 'No file selected'),
                  h('input', { type: 'file', accept: '.csv', onChange: handleCsvUpload, className: 'hidden-file-input' })
                ),
                csvColumns.length > 0 &&
                  h(Input, {
                    label: 'Select Reviews Content Column',
                    id: 'body-column-select',
                    type: 'select',
                    options: csvColumns.map((col) => ({ value: col, label: col })),
                    value: selectedBodyCol,
                    onChange: (e) => setSelectedBodyCol(e.target.value)
                  })
              ),
          error && h('div', { className: 'error-message-block' }, h(AlertTriangle, { size: 18 }), h('span', null, error)),
          h(Button, { type: 'submit', loading, className: 'analyze-btn', icon: ArrowRight }, 'Analyze Reviews')
        )
      ),
      h(
        'div',
        { className: 'results-canvas' },
        loading
          ? h(
              Card,
              { className: 'loading-results-card', hoverable: false },
              h('div', { className: 'loading-state-wrapper' }, h(Loader, { type: 'card', count: 3 }), h('p', { className: 'loading-hint' }, 'Mining sentiment patterns and user friction… please wait.'))
            )
          : result
          ? h(
              'div',
              { className: 'results-wrapper' },
              h(
                'div',
                { className: 'actions-floating-bar glass-panel' },
                h('span', { className: 'results-status' }, 'Analysis Generated'),
                h(
                  'div',
                  { className: 'actions-button-group' },
                  h(Button, { variant: 'secondary', onClick: handleCopyMarkdown, icon: Copy }, isCopied ? 'Copied MD!' : 'Copy Markdown'),
                  h(Button, { variant: 'secondary', onClick: handleDownloadJSON, icon: Download }, 'JSON'),
                  h(Button, { variant: isSaved ? 'secondary' : 'primary', onClick: handleSaveToHistory, disabled: isSaved, icon: Save }, isSaved ? 'Saved to History' : 'Save Report')
                )
              ),
              h(
                Card,
                { className: 'result-detail-card', hoverable: false },
                h('div', { className: 'card-header' }, h('h3', null, 'Sentiment Distribution')),
                h(
                  'div',
                  { className: 'card-body' },
                  h(
                    'div',
                    { className: 'sentiment-bar-chart' },
                    h(
                      'div',
                      { className: 'sentiment-bar-part pos', style: { width: `${result.sentiment.positive}%` }, title: `Positive: ${result.sentiment.positive}%` },
                      h(Smile, { size: 16 }),
                      h('span', null, `${result.sentiment.positive}%`)
                    ),
                    h(
                      'div',
                      { className: 'sentiment-bar-part neu', style: { width: `${result.sentiment.neutral}%` }, title: `Neutral: ${result.sentiment.neutral}%` },
                      h(Meh, { size: 16 }),
                      h('span', null, `${result.sentiment.neutral}%`)
                    ),
                    h(
                      'div',
                      { className: 'sentiment-bar-part neg', style: { width: `${result.sentiment.negative}%` }, title: `Negative: ${result.sentiment.negative}%` },
                      h(Frown, { size: 16 }),
                      h('span', null, `${result.sentiment.negative}%`)
                    )
                  ),
                  h(
                    'div',
                    { className: 'sentiment-legend' },
                    h('span', { className: 'legend-item' }, h('span', { className: 'legend-color pos' }), ' Positive Praise'),
                    h('span', { className: 'legend-item' }, h('span', { className: 'legend-color neu' }), ' Neutral / Feature Inquiries'),
                    h('span', { className: 'legend-item' }, h('span', { className: 'legend-color neg' }), ' Negative Pain Points')
                  )
                )
              ),
              h(
                Card,
                { className: 'result-detail-card', hoverable: false },
                h('div', { className: 'card-header' }, h('h3', null, 'Top Customer Pain Points')),
                h(
                  'div',
                  { className: 'card-body pain-points-list' },
                  result.painPoints.map((point, index) =>
                    h(
                      'div',
                      { key: index, className: 'pain-point-item glass-panel' },
                      h(
                        'div',
                        { className: 'pain-point-header' },
                        h('span', { className: 'pain-point-badge' }, `Rank ${point.rank}`),
                        h('h4', { className: 'pain-point-title' }, point.issue),
                        h('span', { className: `impact-badge impact-${point.impact.toLowerCase()}` }, `${point.impact} Impact`)
                      ),
                      h('div', { className: 'pain-point-solution' }, h('strong', null, 'Recommended Fix:'), ' ', point.action)
                    )
                  )
                )
              ),
              h(
                'div',
                { className: 'feedback-split-grid' },
                h(
                  Card,
                  { className: 'feedback-split-card', hoverable: false },
                  h('div', { className: 'card-header highlight-praise-header' }, h('h4', null, 'Praise Highlights')),
                  h('div', { className: 'card-body' }, h('ul', { className: 'feedback-bullet-list' }, result.positivePraise.map((praise, idx) => h('li', { key: idx }, praise))))
                ),
                h(
                  Card,
                  { className: 'feedback-split-card', hoverable: false },
                  h('div', { className: 'card-header highlight-features-header' }, h('h4', null, 'Suggested Features')),
                  h('div', { className: 'card-body' }, h('ul', { className: 'feedback-bullet-list' }, result.suggestedFeatures.map((feat, idx) => h('li', { key: idx }, feat))))
                )
              )
            )
          : h(
              Card,
              { className: 'empty-results-card', hoverable: false },
              h(
                'div',
                { className: 'empty-state-canvas' },
                h(MessageSquare, { size: 48, className: 'canvas-icon' }),
                h('h3', null, 'Customer Sentiment Insights'),
                h('p', null, 'Paste customer reviews directly or upload a CSV on the left panel to map out qualitative trends and extract immediate UX adjustments.')
              )
            )
      )
    )
  );
}

// ---- Feature Canvas view ----
function FeatureCanvasView() {
  const { addHistoryItem, loadedHistoryItem, setLoadedHistoryItem } = React.useContext(AppContext);

  const [concept, setConcept] = React.useState('');
  const [targetPersona, setTargetPersona] = React.useState('');

  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [result, setResult] = React.useState(null);

  const [expandedStoryId, setExpandedStoryId] = React.useState(null);
  const [copiedId, setCopiedId] = React.useState(null);
  const [isCopied, setIsCopied] = React.useState(false);
  const [isSaved, setIsSaved] = React.useState(false);

  React.useEffect(() => {
    if (loadedHistoryItem && loadedHistoryItem.type === 'feature') {
      const { metadata, data } = loadedHistoryItem;
      if (metadata) {
        setConcept(metadata.concept || '');
        setTargetPersona(metadata.targetPersona || '');
      } else {
        setConcept(loadedHistoryItem.projectName.replace('... Spec', ''));
      }
      setResult(data);
      setIsSaved(true);
      setLoadedHistoryItem(null);
    }
  }, [loadedHistoryItem, setLoadedHistoryItem]);

  const handleRunRoadmap = async (e) => {
    e.preventDefault();
    if (!concept.trim() || !targetPersona.trim()) {
      setError('Please fill out all fields.');
      return;
    }
    setLoading(true);
    setError('');
    setResult(null);
    setIsSaved(false);
    setExpandedStoryId(null);
    try {
      const parsedData = await simulateFeatureRoadmap(concept, targetPersona);
      setResult(parsedData);
    } catch (err) {
      setError(err.message || 'An error occurred during backlog generation.');
    } finally {
      setLoading(false);
    }
  };

  const handleCopyMarkdown = () => {
    if (!result) return;
    let md = `# Feature Roadmap Backlog: ${concept}\n`;
    md += `**Target Persona:** ${targetPersona}\n\n`;
    md += `## Backlog Summary\n${result.roadmapSummary}\n\n`;
    const cols = [
      { name: 'Must-Have Features', key: 'mustHave' },
      { name: 'Should-Have Features', key: 'shouldHave' },
      { name: 'Could-Have Features', key: 'couldHave' }
    ];
    cols.forEach((col) => {
      md += `## ${col.name}\n\n`;
      result.moscow[col.key].forEach((feat) => {
        md += `### ${feat.title}\n`;
        md += `${feat.description}\n`;
        md += `*User Story: ${feat.userStory}*\n\n`;
      });
    });
    navigator.clipboard.writeText(md);
    setIsCopied(true);
    setTimeout(() => setIsCopied(false), 2000);
  };

  const handleDownloadJSON = () => {
    if (!result) return;
    const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `feature-canvas-${Date.now()}.json`;
    link.click();
    URL.revokeObjectURL(url);
  };

  const handleSaveToHistory = () => {
    if (!result || isSaved) return;
    addHistoryItem({
      projectName: `${concept.substring(0, 20)}... Spec`,
      type: 'feature',
      metadata: { concept, targetPersona },
      data: result
    });
    setIsSaved(true);
  };

  const toggleStory = (id) => {
    setExpandedStoryId(expandedStoryId === id ? null : id);
  };

  const copyUserStory = (id, storyText) => {
    navigator.clipboard.writeText(storyText);
    setCopiedId(id);
    setTimeout(() => setCopiedId(null), 1500);
  };

  const renderKanbanColumn = (title, features, colType) => {
    return h(
      'div',
      { className: `kanban-column col-${colType}` },
      h('div', { className: 'kanban-column-header' }, h('h4', null, title), h('span', { className: 'column-count' }, (features && features.length) || 0)),
      h(
        'div',
        { className: 'kanban-column-body' },
        features &&
          features.map((feat) => {
            const isExpanded = expandedStoryId === feat.id;
            const copied = copiedId === feat.id;
            return h(
              'div',
              { key: feat.id, className: 'kanban-card glass-panel' },
              h('div', { className: 'kanban-card-main' }, h('h5', { className: 'kanban-card-title' }, feat.title), h('p', { className: 'kanban-card-desc' }, feat.description)),
              h(
                'div',
                { className: 'kanban-card-actions' },
                h(
                  'button',
                  { type: 'button', className: `story-toggle-btn ${isExpanded ? 'active' : ''}`, onClick: () => toggleStory(feat.id) },
                  h('span', null, 'User Story'),
                  isExpanded ? h(ChevronUp, { size: 14 }) : h(ChevronDown, { size: 14 })
                )
              ),
              isExpanded &&
                h(
                  'div',
                  { className: 'kanban-card-story-drawer' },
                  h('p', { className: 'story-text' }, `"${feat.userStory}"`),
                  h(
                    'button',
                    { type: 'button', className: 'copy-story-btn', onClick: () => copyUserStory(feat.id, feat.userStory) },
                    copied
                      ? [h(ClipboardCheck, { key: 'i', size: 12, className: 'copied-icon' }), h('span', { key: 't' }, 'Copied!')]
                      : [h(Clipboard, { key: 'i', size: 12 }), h('span', { key: 't' }, 'Copy Story')]
                  )
                )
            );
          })
      )
    );
  };

  return h(
    'div',
    { className: 'feature-container' },
    h(
      'div',
      { className: 'feature-grid' },
      h(
        Card,
        { className: 'setup-panel-card', hoverable: false },
        h('div', { className: 'card-header' }, h('h3', null, 'Feature Spec Config')),
        h(
          'form',
          { onSubmit: handleRunRoadmap, className: 'card-body setup-form' },
          h(Input, {
            label: 'Product Core Concept / Idea',
            id: 'product-concept',
            type: 'textarea',
            placeholder: 'Describe your core product idea, main functions, and what user value it drives…',
            value: concept,
            onChange: (e) => setConcept(e.target.value),
            rows: 6,
            required: true
          }),
          h(Input, {
            label: 'Target Customer Persona',
            id: 'target-persona',
            placeholder: 'e.g. Busy freelance software engineers, eCommerce managers',
            value: targetPersona,
            onChange: (e) => setTargetPersona(e.target.value),
            required: true
          }),
          error && h('div', { className: 'error-message-block' }, h(AlertTriangle, { size: 18 }), h('span', null, error)),
          h(Button, { type: 'submit', loading, className: 'analyze-btn', icon: ArrowRight }, 'Generate Backlog')
        )
      ),
      h(
        'div',
        { className: 'results-canvas' },
        loading
          ? h(
              Card,
              { className: 'loading-results-card', hoverable: false },
              h('div', { className: 'loading-state-wrapper' }, h(Loader, { type: 'kanban', count: 2 }), h('p', { className: 'loading-hint' }, 'Generating prioritized user stories… this will take a moment.'))
            )
          : result
          ? h(
              'div',
              { className: 'results-wrapper' },
              h(
                'div',
                { className: 'actions-floating-bar glass-panel' },
                h('span', { className: 'results-status' }, 'Roadmap Synced'),
                h(
                  'div',
                  { className: 'actions-button-group' },
                  h(Button, { variant: 'secondary', onClick: handleCopyMarkdown, icon: Copy }, isCopied ? 'Copied MD!' : 'Copy Markdown'),
                  h(Button, { variant: 'secondary', onClick: handleDownloadJSON, icon: Download }, 'JSON'),
                  h(Button, { variant: isSaved ? 'secondary' : 'primary', onClick: handleSaveToHistory, disabled: isSaved, icon: Save }, isSaved ? 'Saved to History' : 'Save Report')
                )
              ),
              h(
                Card,
                { className: 'result-detail-card spec-summary-card', hoverable: false },
                h('div', { className: 'card-header' }, h('h3', null, 'Roadmap Strategy Summary')),
                h('div', { className: 'card-body' }, h('p', { className: 'summary-paragraph' }, result.roadmapSummary))
              ),
              h(
                'div',
                { className: 'kanban-board-wrapper' },
                renderKanbanColumn('Must-Have (MVP Core)', result.moscow && result.moscow.mustHave, 'must'),
                renderKanbanColumn('Should-Have (Next Core)', result.moscow && result.moscow.shouldHave, 'should'),
                renderKanbanColumn('Could-Have (Backlog Nice)', result.moscow && result.moscow.couldHave, 'could')
              )
            )
          : h(
              Card,
              { className: 'empty-results-card', hoverable: false },
              h(
                'div',
                { className: 'empty-state-canvas' },
                h(KanbanSquare, { size: 48, className: 'canvas-icon' }),
                h('h3', null, 'Product Backlog Canvas'),
                h('p', null, 'Provide your product outline and customer persona on the left, then click "Generate" to map out user story specs on a MoSCoW board.')
              )
            )
      )
    )
  );
}

// ---- App root ----
function App() {
  const { currentView, activeProvider, activeModel, isConnected } = React.useContext(AppContext);

  const renderView = () => {
    switch (currentView) {
      case 'settings':
        return h(SettingsView);
      case 'dashboard':
        return h(DashboardView);
      case 'competitor':
        return h(CompetitorView);
      case 'review':
        return h(ReviewAnalyzerView);
      case 'feature':
        return h(FeatureCanvasView);
      default:
        return h(SettingsView);
    }
  };

  return h(
    'div',
    { className: 'app-layout' },
    h(Navigation),
    h(
      'div',
      { className: 'app-main-content' },
      h(
        'header',
        { className: 'app-header' },
        h(
          'div',
          { className: 'header-breadcrumbs' },
          h('span', { className: 'breadcrumb-parent' }, 'Synthesize'),
          h('span', { className: 'breadcrumb-separator' }, '/'),
          h('span', { className: 'breadcrumb-current' }, currentView.charAt(0).toUpperCase() + currentView.slice(1))
        ),
        h(StatusIndicator, { provider: activeProvider, model: activeModel, isConnected })
      ),
      h('main', { className: 'app-view-container' }, h(
        'div',
        { className: 'demo-banner' },
        h(ShieldAlert, { size: 16 }),
        h('span', null, 'Simulated AI engine — all analysis below is generated locally in your browser, not by a real LLM. No API keys, network calls, or backend required.')
      ), renderView())
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  h(
    React.StrictMode,
    null,
    h(AppProvider, null, h(App))
  )
);
</script>
</body>
</html>
